<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>学習カレンダー（テスト版）</title>
  <script>
    // 本体と同じ判定でダークモードを先に当てる（ちらつき防止）
    (function () {
      var wantDark = false;
      try {
        var saved = localStorage.getItem("darkMode");
        wantDark = saved !== null ? saved === "true" : window.matchMedia("(prefers-color-scheme: dark)").matches;
      } catch (e) {}
      if (wantDark) document.documentElement.classList.add("dark");
    })();
  </script>
  <style>
    :root {
      --bg: #f7fafc;
      --card: #ffffff;
      --text: #2d3748;
      --muted: #718096;
      --border: #e2e8f0;
      --primary: #4a77bc;
      --lv0: #ebedf0;
      --lv1: #c6dbf7;
      --lv2: #8bb3eb;
      --lv3: #4a77bc;
      --lv4: #2b4c7e;
      --good: #38a169;
      --bad: #e53e3e;
    }
    :root.dark {
      --bg: #1a202c;
      --card: #2d3748;
      --text: #e2e8f0;
      --muted: #a0aec0;
      --border: #4a5568;
      --primary: #7fa7e0;
      --lv0: #3a4556;
      --lv1: #2b4c7e;
      --lv2: #3d68a8;
      --lv3: #5f8fd6;
      --lv4: #9cc0f5;
      --good: #68d391;
      --bad: #fc8181;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: 'Helvetica Neue', Arial, 'Hiragino Kaku Gothic ProN', 'Segoe UI', sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.6;
    }
    .container { max-width: 900px; margin: 0 auto; padding: 24px 16px 48px; }
    a.back { color: var(--primary); text-decoration: none; font-weight: bold; }
    a.back:hover { text-decoration: underline; }
    h1 { font-size: 1.6rem; margin: 12px 0 20px; }
    h2 { font-size: 1.1rem; margin: 0 0 12px; }
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 16px;
      margin-bottom: 16px;
    }
    .summary { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 12px; }
    .stat { text-align: center; }
    .stat .num { font-size: 1.8rem; font-weight: bold; }
    .stat .label { font-size: 0.85rem; color: var(--muted); }

    .heatmap-wrap { overflow-x: auto; padding-bottom: 4px; }
    .heatmap { display: inline-grid; grid-template-rows: 14px repeat(7, 12px); grid-auto-flow: column; grid-auto-columns: 12px; gap: 3px; }
    .month { font-size: 10px; color: var(--muted); white-space: nowrap; }
    .cell { width: 12px; height: 12px; border-radius: 2px; background: var(--lv0); cursor: pointer; border: 0; padding: 0; }
    .cell.lv1 { background: var(--lv1); }
    .cell.lv2 { background: var(--lv2); }
    .cell.lv3 { background: var(--lv3); }
    .cell.lv4 { background: var(--lv4); }
    .cell.future { visibility: hidden; cursor: default; }
    .cell.selected { outline: 2px solid var(--text); outline-offset: 1px; }
    .legend { display: flex; align-items: center; gap: 4px; justify-content: flex-end; font-size: 0.8rem; color: var(--muted); margin-top: 8px; }
    .legend .cell { cursor: default; }

    .day-title { font-weight: bold; }
    .muted { color: var(--muted); font-size: 0.9rem; }
    .words { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; padding: 0; list-style: none; }
    .words li { border: 1px solid var(--bad); color: var(--bad); border-radius: 999px; padding: 1px 10px; font-size: 0.9rem; }

    table { width: 100%; border-collapse: collapse; font-size: 0.9rem; }
    th, td { text-align: left; padding: 6px 4px; border-bottom: 1px solid var(--border); }
    th { color: var(--muted); font-weight: normal; }
    .bar { height: 8px; background: var(--lv0); border-radius: 4px; overflow: hidden; min-width: 60px; }
    .bar > span { display: block; height: 100%; background: var(--good); }
    .test-notice {
      border: 1px dashed var(--primary);
      border-radius: 10px;
      padding: 10px 14px;
      margin-bottom: 16px;
      font-size: 0.9rem;
      color: var(--muted);
    }
    .test-notice strong { color: var(--primary); }
  </style>
</head>
<body>
  <div class="container">
    <a href="../" class="back">← アプリに戻る</a>
    <h1>学習カレンダー</h1>

    <div class="test-notice">
      <strong>テストページ</strong>：このページは Claude Code で作成した試作版です。表示や集計の内容は今後変わることがあります。
    </div>

    <div class="card summary">
      <div class="stat"><div class="num" id="streakNow">0</div><div class="label">連続学習日数</div></div>
      <div class="stat"><div class="num" id="streakMax">0</div><div class="label">最長連続記録</div></div>
      <div class="stat"><div class="num" id="todayCount">0</div><div class="label">今日解いた問題</div></div>
      <div class="stat"><div class="num" id="totalDays">0</div><div class="label">学習した日数</div></div>
      <div class="stat"><div class="num" id="totalRate">-</div><div class="label">全体の正答率</div></div>
    </div>

    <div class="card">
      <h2>過去1年の記録</h2>
      <div class="heatmap-wrap"><div class="heatmap" id="heatmap"></div></div>
      <div class="legend">
        少ない
        <span class="cell"></span><span class="cell lv1"></span><span class="cell lv2"></span><span class="cell lv3"></span><span class="cell lv4"></span>
        多い
      </div>
    </div>

    <div class="card" id="dayDetail">
      <div class="day-title" id="dayTitle"></div>
      <div class="muted" id="daySummary"></div>
      <ul class="words" id="dayMistakes"></ul>
    </div>

    <div class="card">
      <h2>最近14日間</h2>
      <table>
        <thead><tr><th>日付</th><th>問題数</th><th>正解</th><th>正答率</th><th></th></tr></thead>
        <tbody id="recent"></tbody>
      </table>
    </div>

    <p class="muted">※ 設定の「結果を記録」がオンのときに解いた問題だけが集計されます。記録はこのブラウザ内（localStorage）にのみ保存されています。</p>
  </div>

  <script>
  (function () {
    const 曜日 = ["日", "月", "火", "水", "木", "金", "土"];

    // 本体の saveStudyLog と同じ形式（端末の時刻で YYYY-MM-DD）
    function 日付キー(d) {
      return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
    }
    function 日をずらす(d, n) {
      return new Date(d.getFullYear(), d.getMonth(), d.getDate() + n);
    }

    // studyLog = { "YYYY-MM-DD": [{ word, correct }, ...] }
    // バックアップ読み込みで壊れた値が入っていても落ちないように、形を確かめながら集計する
    function 記録を読み込む() {
      let raw = {};
      try { raw = JSON.parse(localStorage.getItem("studyLog") || "{}") || {}; } catch (e) { raw = {}; }
      const 日別 = new Map();
      if (typeof raw !== "object" || Array.isArray(raw)) return 日別;
      for (const [key, list] of Object.entries(raw)) {
        if (!/^\d{4}-\d{2}-\d{2}$/.test(key) || !Array.isArray(list)) continue;
        let total = 0, correct = 0;
        const mistakes = new Map(); // 単語 → 間違えた回数
        for (const item of list) {
          if (!item || typeof item !== "object") continue;
          total++;
          if (item.correct === true) {
            correct++;
          } else if (typeof item.word === "string") {
            mistakes.set(item.word, (mistakes.get(item.word) || 0) + 1);
          }
        }
        if (total > 0) 日別.set(key, { total, correct, mistakes });
      }
      return 日別;
    }

    function 連続日数を数える(日別, today) {
      // 今日まだ解いていなくても、昨日まで続いていれば途切れていない扱いにする
      let d = 日別.has(日付キー(today)) ? today : 日をずらす(today, -1);
      let now = 0;
      while (日別.has(日付キー(d))) { now++; d = 日をずらす(d, -1); }

      let max = 0, run = 0, prev = null;
      for (const key of [...日別.keys()].sort()) {
        const [y, m, dd] = key.split("-").map(Number);
        const cur = new Date(y, m - 1, dd);
        run = (prev && 日付キー(日をずらす(prev, 1)) === key) ? run + 1 : 1;
        if (run > max) max = run;
        prev = cur;
      }
      return { now, max };
    }

    // 色の段階は「その人の最大値」基準だと1日だけ多い日に引っ張られるので、固定の区切りにする
    function 段階(n) {
      if (n <= 0) return 0;
      if (n < 20) return 1;
      if (n < 50) return 2;
      if (n < 100) return 3;
      return 4;
    }

    function 正答率(c, t) {
      return t > 0 ? Math.round((c / t) * 100) : 0;
    }

    function 日の詳細を表示(key, 日別) {
      const [y, m, d] = key.split("-").map(Number);
      const date = new Date(y, m - 1, d);
      document.getElementById("dayTitle").textContent = `${y}年${m}月${d}日（${曜日[date.getDay()]}）`;
      const ul = document.getElementById("dayMistakes");
      ul.replaceChildren();
      const day = 日別.get(key);
      if (!day) {
        document.getElementById("daySummary").textContent = "この日の記録はありません。";
        return;
      }
      document.getElementById("daySummary").textContent =
        `${day.total}問 / 正解 ${day.correct}問（${正答率(day.correct, day.total)}%）` +
        (day.mistakes.size ? " ・ 間違えた単語:" : " ・ 全問正解！");
      // 間違えた回数が多い順
      const sorted = [...day.mistakes.entries()].sort((a, b) => b[1] - a[1]);
      for (const [word, n] of sorted) {
        const li = document.createElement("li");
        li.textContent = n > 1 ? `${word} ×${n}` : word; // 単語は textContent で入れる（記録は外部ファイルから読み込まれることもあるため）
        ul.appendChild(li);
      }
    }

    function ヒートマップを描く(日別, today) {
      const root = document.getElementById("heatmap");
      const frag = document.createDocumentFragment();
      // 今週の日曜から52週さかのぼった日曜を開始日にする（53列）
      const start = 日をずらす(today, -today.getDay() - 52 * 7);
      let selected = null;

      for (let w = 0; w < 53; w++) {
        const weekStart = 日をずらす(start, w * 7);
        // 列の先頭に月ラベル（その週に1日が含まれるときだけ。隣の列とラベルが重ならないように）
        const label = document.createElement("div");
        label.className = "month";
        const weekEnd = 日をずらす(weekStart, 6);
        if (weekEnd.getDate() <= 7) label.textContent = `${weekEnd.getMonth() + 1}月`;
        frag.appendChild(label);

        for (let i = 0; i < 7; i++) {
          const d = 日をずらす(weekStart, i);
          const key = 日付キー(d);
          const cell = document.createElement("button");
          cell.type = "button";
          if (d > today) {
            cell.className = "cell future";
            cell.tabIndex = -1;
            frag.appendChild(cell);
            continue;
          }
          const day = 日別.get(key);
          const n = day ? day.total : 0;
          cell.className = "cell lv" + 段階(n);
          cell.title = day
            ? `${key}：${n}問（正答率 ${正答率(day.correct, n)}%）`
            : `${key}：記録なし`;
          cell.addEventListener("click", () => {
            if (selected) selected.classList.remove("selected");
            cell.classList.add("selected");
            selected = cell;
            日の詳細を表示(key, 日別);
          });
          if (key === 日付キー(today)) { cell.classList.add("selected"); selected = cell; }
          frag.appendChild(cell);
        }
      }
      root.replaceChildren(frag);
      // 横スクロールが出る幅では最新（右端）を見せる
      const wrap = root.parentElement;
      wrap.scrollLeft = wrap.scrollWidth;
    }

    function 最近の表を描く(日別, today) {
      const tbody = document.getElementById("recent");
      tbody.replaceChildren();
      for (let i = 0; i < 14; i++) {
        const d = 日をずらす(today, -i);
        const key = 日付キー(d);
        const day = 日別.get(key) || { total: 0, correct: 0 };
        const rate = 正答率(day.correct, day.total);
        const tr = document.createElement("tr");
        const cells = [
          `${d.getMonth() + 1}/${d.getDate()}（${曜日[d.getDay()]}）`,
          day.total,
          day.correct,
          day.total ? rate + "%" : "-",
        ];
        for (const v of cells) {
          const td = document.createElement("td");
          td.textContent = v;
          tr.appendChild(td);
        }
        const barTd = document.createElement("td");
        const bar = document.createElement("div");
        bar.className = "bar";
        const fill = document.createElement("span");
        fill.style.width = (day.total ? rate : 0) + "%";
        bar.appendChild(fill);
        barTd.appendChild(bar);
        tr.appendChild(barTd);
        tbody.appendChild(tr);
      }
    }

    function 描画() {
      const today = new Date();
      today.setHours(0, 0, 0, 0);
      const 日別 = 記録を読み込む();

      const streak = 連続日数を数える(日別, today);
      let total = 0, correct = 0;
      for (const day of 日別.values()) { total += day.total; correct += day.correct; }
      const todayData = 日別.get(日付キー(today));

      document.getElementById("streakNow").textContent = streak.now + "日";
      document.getElementById("streakMax").textContent = streak.max + "日";
      document.getElementById("todayCount").textContent = todayData ? todayData.total : 0;
      document.getElementById("totalDays").textContent = 日別.size + "日";
      document.getElementById("totalRate").textContent = total ? 正答率(correct, total) + "%" : "-";

      ヒートマップを描く(日別, today);
      最近の表を描く(日別, today);
      日の詳細を表示(日付キー(today), 日別);
    }

    描画();
    // 別タブでクイズを解いたら更新
    window.addEventListener("storage", (e) => {
      if (e.key === "studyLog" || e.key === null) 描画();
    });
  })();
  </script>
</body>
</html>
